<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>设置 · {{TITLE}}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6a7280; --line: #e3e6ea;
    --ok: #16a34a; --ok-bg: #ecfdf3; --bad: #dc2626; --bad-bg: #fef2f2;
    --warn: #b45309; --warn-bg: #fffbeb;
    --accent: #2563eb; --accent-soft: #eff4ff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2028; --text: #e8eaee; --muted: #9aa3b2; --line: #2b313b;
      --ok: #4ade80; --ok-bg: #12281c; --bad: #f87171; --bad-bg: #2a1517;
      --warn: #fbbf24; --warn-bg: #2a2213;
      --accent: #60a5fa; --accent-soft: #182338;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  h1 { font-size: 18px; margin: 0; }
  .spacer { flex: 1; }
  a.btn, button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 13px; text-decoration: none;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: background .15s, border-color .15s;
  }
  a.btn:hover, button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.06); color: #fff; }
  button.danger { color: var(--bad); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
  }
  .card > .top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .card > .top .name { font-weight: 600; }
  .card > .top .meta { color: var(--muted); font-size: 12px; }
  .card > .body { padding: 14px 16px 16px; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
  .badge.env { background: var(--warn-bg); color: var(--warn); }
  .badge.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .hint.warn { color: var(--warn); }
  label.f { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
  label.f > span { flex: 0 0 92px; color: var(--muted); font-size: 13px; padding-top: 7px; }
  label.f > input, label.f > textarea {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  label.f > textarea { min-height: 62px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  label.f > input:focus, label.f > textarea:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .acct { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; margin-top: 12px; background: var(--bg); }
  .acct-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acct-head .idx { color: var(--muted); font-size: 12px; min-width: 22px; }
  .acct-head input.name {
    flex: 1; min-width: 120px; font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .acct-head button { padding: 4px 10px; font-size: 12px; }
  .res { font-size: 12px; margin-top: 8px; min-height: 18px; }
  .res.ok { color: var(--ok); } .res.bad { color: var(--bad); }
  .res.unknown, .res.unsupported { color: var(--warn); }
  .row-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: .95; transform: translate(-50%, 0); }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>设置</h1>
    <span class="meta" id="stamp"></span>
    <span class="spacer"></span>
    <a class="btn" href="/">返回状态</a>
    <form method="post" action="/logout" style="margin:0"><button type="submit">退出</button></form>
  </header>

  <div class="card">
    <div class="top"><span class="name">面板口令</span><span class="meta" id="pwSource"></span></div>
    <div class="body">
      <label class="f"><span>当前口令</span><input type="password" id="pwCurrent" autocomplete="current-password"></label>
      <label class="f"><span>新口令</span><input type="password" id="pwNext" autocomplete="new-password" placeholder="至少 8 位"></label>
      <label class="f"><span>确认新口令</span><input type="password" id="pwNext2" autocomplete="new-password"></label>
      <div class="row-actions"><button class="primary" id="pwSave" type="button">修改口令</button></div>
      <p class="hint" id="pwHint"></p>
    </div>
  </div>

  <div class="card">
    <div class="top"><span class="name">代理</span><span class="meta">留空 = 直连；支持 http / https / socks5 / socks5h</span></div>
    <div class="body">
      <label class="f"><span>全局代理</span><input id="proxyGlobal" placeholder="http://192.168.1.2:7890"></label>
      <div class="grid2" id="proxySites" style="margin-top:10px"></div>
      <div class="row-actions"><button class="primary" id="proxySave" type="button">保存代理</button></div>
      <p class="hint">189 天翼云盘走 SDK 登录，代理对它不生效。</p>
    </div>
  </div>

  <div id="sites"></div>

  <footer>凭据保存在容器的 <code>data/settings.json</code>（权限 600），不会进 git、不会进镜像。<br>
  面板保存过的站点，优先于 <code>.env</code> 与 <code>config.json</code>。</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var DATA = null;
  var SOURCE_TEXT = { panel: '面板配置', env: '环境变量', file: 'config.json', none: '未配置' };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(text) {
    var div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }
  function toast(message) {
    var el = $('#toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  function api(url, payload) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload || {})
    }).then(function (resp) {
      if (resp.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
      return resp.json();
    });
  }

  // ---------------- 站点卡片 ----------------
  function fieldRow(site, acct, field) {
    var secret = site.secret_fields.indexOf(field) >= 0;
    var raw = acct && acct.values ? (acct.values[field] || '') : '';
    var has = acct && acct.has ? !!acct.has[field] : false;
    var placeholder = secret
      ? (has ? '已配置：' + raw + '（留空表示不修改）' : '粘贴 ' + field + ' 的值')
      : '留空表示清空';
    if (secret) {
      return '<label class="f"><span>' + esc(field) + '</span><textarea data-field="' + esc(field) +
        '" autocomplete="off" spellcheck="false" placeholder="' + esc(placeholder) + '"></textarea></label>';
    }
    return '<label class="f"><span>' + esc(field) + '</span><input data-field="' + esc(field) +
      '" value="' + esc(raw) + '" placeholder="' + esc(placeholder) + '"></label>';
  }

  function accountBlock(site, acct, index) {
    var head = '<div class="acct-head"><span class="idx">#' + (index + 1) + '</span>' +
      '<input class="name" placeholder="备注，如 主号（可选）" value="' + esc(acct ? acct.name : '') + '">' +
      '<button type="button" class="check"' + (site.supports_check ? '' : ' disabled title="该站点暂不支持在线检测"') + '>检测</button>' +
      '<button type="button" class="del danger">删除</button></div>';
    var rows = site.fields.map(function (f) { return fieldRow(site, acct, f); }).join('');
    var proxyRow = '<label class="f"><span>代理</span><input class="proxy" placeholder="可选，留空用站点/全局代理" value="' +
      esc(acct ? acct.proxy : '') + '"></label>';
    var res = site.supports_check ? '' : '<div class="res unsupported">该站点暂不支持在线检测，点“立即签到”看结果即可</div>';
    return '<div class="acct" data-from="' + (acct ? acct.index : '') + '">' + head + rows + proxyRow + res + '</div>';
  }

  function siteCard(site) {
    var accounts = (site.accounts || []).map(function (acct, i) { return accountBlock(site, acct, i); }).join('');
    var source = SOURCE_TEXT[site.source] || site.source;
    var badgeClass = site.source === 'panel' ? '' : (site.source === 'env' ? ' env' : ' none');
    var warn = site.source === 'env' || site.source === 'file'
      ? '<p class="hint warn">这个站点当前用 ' + esc(source) + ' 的配置。在这里保存后会由面板接管，' +
        esc(source) + ' 里的同名配置不再生效；清空所有账号并保存可以还原。</p>'
      : '';
    return '<div class="card site" data-key="' + esc(site.key) + '">' +
      '<div class="top"><span class="name">' + esc(site.name) + '</span>' +
      '<span class="meta">' + esc(site.key) + '</span>' +
      '<span class="badge' + badgeClass + '">' + esc(source) + '</span></div>' +
      '<div class="body">' +
      (site.doc ? '<p class="hint">' + esc(site.doc) + '</p>' : '') + warn +
      '<div class="accts">' + accounts + '</div>' +
      '<div class="row-actions"><button type="button" class="add">+ 添加账号</button>' +
      '<button type="button" class="primary save">保存' + esc(site.name) + '</button></div>' +
      '</div></div>';
  }

  function renderSites(list) {
    $('#sites').innerHTML = list.map(siteCard).join('');
  }

  function findSite(key) {
    return (DATA.sites || []).filter(function (s) { return s.key === key; })[0];
  }

  function collectSite(card) {
    return $$('.acct', card).map(function (el) {
      var from = el.getAttribute('data-from');
      var values = {};
      $$('[data-field]', el).forEach(function (input) {
        values[input.getAttribute('data-field')] = input.value;
      });
      return {
        from: from === '' ? null : parseInt(from, 10),
        name: $('.name', el).value.trim(),
        values: values,
        proxy: $('.proxy', el).value.trim()
      };
    });
  }

  // ---------------- 代理 ----------------
  function renderProxies(proxy) {
    $('#proxyGlobal').value = proxy.global || '';
    if (!proxy.global && proxy.global_env) {
      $('#proxyGlobal').placeholder = '来自 .env：' + proxy.global_env + '（留空则继续用它）';
    }
    var keys = (DATA.sites || []).map(function (s) { return s.key; });
    $('#proxySites').innerHTML = keys.map(function (key) {
      var value = (proxy.sites || {})[key] || '';
      return '<label class="f" style="margin-top:0"><span>' + esc(key) + '</span>' +
        '<input class="psite" data-key="' + esc(key) + '" value="' + esc(value) + '" placeholder="留空=用全局"></label>';
    }).join('');
  }

  // ---------------- 加载 ----------------
  function apply(settings) {
    DATA = settings;
    document.title = '设置 · ' + (settings.title || '');
    $('#stamp').textContent = settings.allow_edit ? '' : '面板已禁用配置修改（PANEL_ALLOW_EDIT=false）';
    var sourceMap = { env: '来自 .env 的 PANEL_PASSWORD', panel: '已在网页上修改过', generated: '首次启动随机生成' };
    $('#pwSource').textContent = sourceMap[settings.password.source] || '';
    $('#pwHint').textContent = settings.password.source === 'env'
      ? '当前口令来自 .env。在这里改会覆盖它，下次启动仍然生效；想彻底改回 .env 的值，把 PANEL_PASSWORD 换成新的再重启。'
      : '忘记口令只能改 .env 的 PANEL_PASSWORD 或删掉 data/panel_auth.json 后重启。';
    renderProxies(settings.proxy || {});
    renderSites(settings.sites || []);
    if (!settings.allow_edit) {
      $$('#sites button, #sites input, #sites textarea, #pwSave, #proxySave, #pwCurrent, #pwNext, #pwNext2, #proxyGlobal, .psite')
        .forEach(function (el) { el.disabled = true; });
    }
  }

  function load() {
    fetch('/api/settings', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (resp) {
        if (resp.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
        return resp.json();
      })
      .then(apply)
      .catch(function () {});
  }

  // ---------------- 交互 ----------------
  $('#sites').addEventListener('click', function (event) {
    var card = event.target.closest('.site');
    if (!card) return;
    var key = card.getAttribute('data-key');
    var site = findSite(key);

    if (event.target.classList.contains('add')) {
      var holder = $('.accts', card);
      var wrapper = document.createElement('div');
      var index = $$('.acct', card).length;
      wrapper.innerHTML = accountBlock(site, null, index);
      holder.appendChild(wrapper.firstChild);
      return;
    }

    if (event.target.classList.contains('del')) {
      var acct = event.target.closest('.acct');
      if (confirm('删除这个账号？（点“保存”后才真正生效）')) acct.remove();
      return;
    }

    if (event.target.classList.contains('check')) {
      var block = event.target.closest('.acct');
      var from = block.getAttribute('data-from');
      var res = $('.res', block);
      if (from === '') { res.className = 'res unknown'; res.textContent = '先保存这个账号，再点检测'; return; }
      event.target.disabled = true;
      res.className = 'res'; res.textContent = '检测中…';
      api('/api/check', { site: key, index: parseInt(from, 10) })
        .then(function (data) {
          res.className = 'res ' + (data.status || 'unknown');
          res.textContent = (data.status === 'ok' ? '✅ ' : data.status === 'bad' ? '❌ ' : '⚠️ ') + (data.message || '');
        })
        .catch(function () { res.className = 'res bad'; res.textContent = '检测请求失败'; })
        .finally(function () { event.target.disabled = false; });
      return;
    }

    if (event.target.classList.contains('save')) {
      var payload = { sites: {} };
      payload.sites[key] = collectSite(card);
      event.target.disabled = true;
      api('/api/settings', payload)
        .then(function (data) {
          toast(data.message || (data.ok ? '已保存' : '保存失败'));
          if (data.ok && data.settings) apply(data.settings);
        })
        .catch(function () { toast('保存失败'); })
        .finally(function () { event.target.disabled = false; });
    }
  });

  $('#proxySave').addEventListener('click', function () {
    var sites = {};
    $$('.psite').forEach(function (input) {
      if (input.getAttribute('data-dirty') === '1') sites[input.getAttribute('data-key')] = input.value.trim();
    });
    var payload = { proxy: { sites: sites } };
    var globalInput = $('#proxyGlobal');
    if (globalInput.getAttribute('data-dirty') === '1') payload.proxy.global = globalInput.value.trim();
    if (!Object.keys(sites).length && payload.proxy.global === undefined) { toast('没有改动'); return; }
    this.disabled = true;
    var btn = this;
    api('/api/settings', payload)
      .then(function (data) {
        toast(data.message || (data.ok ? '已保存' : '保存失败'));
        if (data.ok && data.settings) apply(data.settings);
      })
      .catch(function () { toast('保存失败'); })
      .finally(function () { btn.disabled = false; });
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'proxyGlobal' || event.target.classList.contains('psite')) {
      event.target.setAttribute('data-dirty', '1');
    }
  });

  $('#pwSave').addEventListener('click', function () {
    var current = $('#pwCurrent').value;
    var next = $('#pwNext').value;
    var again = $('#pwNext2').value;
    if (!current) { toast('先填当前口令'); return; }
    if (next.length < 8) { toast('新口令至少 8 位'); return; }
    if (next !== again) { toast('两次输入的新口令不一致'); return; }
    var btn = this;
    btn.disabled = true;
    api('/api/password', { current: current, next: next })
      .then(function (data) {
        toast(data.message || (data.ok ? '已更新' : '失败'));
        if (data.ok) {
          $('#pwCurrent').value = ''; $('#pwNext').value = ''; $('#pwNext2').value = '';
          load();
        }
      })
      .catch(function () { toast('修改失败'); })
      .finally(function () { btn.disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
