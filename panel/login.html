<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录 · {{TITLE}}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6a7280; --line:#e3e6ea; --accent:#2563eb; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1c2028; --text:#e8eaee; --muted:#9aa3b2; --line:#2b313b; --accent:#60a5fa; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  form {
    width: min(360px, calc(100vw - 40px)); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 26px 24px; box-shadow: 0 8px 24px rgba(16,24,40,.08);
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.tip { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
  p.error { color: var(--bad); font-size: 13px; margin: 0 0 14px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>{{TITLE}}</h1>
    <p class="tip">请输入面板口令。忘了就改环境变量 PANEL_PASSWORD 后重启容器。</p>
    {{ERROR}}
    <input type="password" name="password" placeholder="面板口令" autocomplete="current-password" autofocus required>
    <button type="submit">登录</button>
  </form>
</body>
</html>
