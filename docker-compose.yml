services:
  checkin:
    # ============================================================
    # 镜像来源：A、B 二选一
    #   切换时把另一组整组注释掉，两组的 image 不能同时留着
    #   不要加 pull_policy 字段，它会覆盖默认行为（见 README 常见问题）
    # ============================================================

    # ---- A. 本地构建（默认）----
    #   启动：docker compose up -d --build
    build: .
    image: checkin:latest

    # ---- B. 用 GitHub Actions 构建好的镜像（NAS 上不用编译）----
    #   切换步骤：把上面 A 的 build 和 image 两行注释掉，放开下面一行，然后
    #       docker compose pull && docker compose up -d
    # image: ghcr.io/<你的用户名>/checkin:latest

    container_name: checkin
    restart: unless-stopped
    ports:
      # 冒号左边是 NAS 上的访问端口；只在局域网用就别往公网映射
      - "8181:8080"
    environment:
      - TZ=Asia/Shanghai
      # ---- 调度 ----
      # 每天几点跑，可写多个：09:10 或 09:10,21:30
      # 面板「设置 → 定时运行」里保存过就以面板为准（改完 15 秒生效，不用重启）
      # 写成 RUN_AT= （空值）＝ 单次模式：跑一次就退出，交给外部 cron
      - RUN_AT=09:10
      - RUN_ON_START=false
      # ---- 网页面板 ----
      - PANEL_ENABLED=true
      - PANEL_TITLE=我的签到
      - PANEL_PORT=8080
      - PANEL_ALLOW_RUN=true    # 是否允许在网页上点“立即签到”
      - PANEL_ALLOW_EDIT=true   # 是否允许在网页上改口令 / 改 cookie / 改代理
      # 面板口令：建议写在同目录 .env 里（PANEL_PASSWORD=xxx），留空则首次启动随机生成并打印到 docker logs
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
    env_file:
      - .env
    volumes:
      # 面板状态 / 历史 / 口令 / 网页里保存的账号，都在这，别删
      - ./data:/app/data
    # 想用 config.json 管账号（格式与 dailycheckin-plus 一致）就放开下面这行
    # - ./config.json:/app/config.json:ro
