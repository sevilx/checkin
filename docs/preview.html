<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>我的签到 · 界面预览</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6a7280;
    --line: #e3e6ea;
    --ok: #16a34a;
    --ok-bg: #ecfdf3;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --card: #1c2028;
      --text: #e8eaee;
      --muted: #9aa3b2;
      --line: #2b313b;
      --ok: #4ade80;
      --ok-bg: #12281c;
      --bad: #f87171;
      --bad-bg: #2a1517;
      --accent: #60a5fa;
      --accent-soft: #182338;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .stamp { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: background .15s, border-color .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.06); color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .banner {
    display: none; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 16px;
    border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px;
  }
  .banner.show { display: flex; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 26px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 0; overflow: hidden; box-shadow: var(--shadow);
  }
  .card .top { display: flex; align-items: center; gap: 10px; padding: 13px 15px 11px; border-bottom: 1px solid var(--line); }
  .card .name { font-weight: 600; }
  .card .label { color: var(--muted); font-size: 12px; }
  .badge { margin-left: auto; font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .card .body { padding: 10px 15px 14px; }
  .row { display: flex; gap: 10px; padding: 3px 0; font-size: 13px; }
  .row .rn { color: var(--muted); flex: 0 0 82px; }
  .row .rv { flex: 1; word-break: break-word; }
  .err { color: var(--bad); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: .95; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">我的签到 · 界面预览</h1>
    <span class="stamp" id="stamp">加载中…</span>
    <span class="spacer"></span>
    <button id="refresh" type="button">刷新</button>
    <a class="btn" href="/settings" style="font:inherit;cursor:pointer;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none">设置</a>
    <button id="run" class="primary" type="button">立即签到</button>
    <form method="post" action="/logout" style="margin:0">
      <button type="submit">退出</button>
    </form>
  </header>

  <div class="banner" id="banner"><span class="dot"></span><span id="bannerText">任务执行中…</span></div>

  <div class="stats">
    <div class="stat"><div class="k">成功 / 总数</div><div class="v" id="statOk">–</div></div>
    <div class="stat"><div class="k">上次耗时</div><div class="v" id="statElapsed">–</div></div>
    <div class="stat"><div class="k">最近更新</div><div class="v" id="statTime" style="font-size:15px">–</div></div>
    <div class="stat"><div class="k">下次运行</div><div class="v" id="statNext" style="font-size:15px">–</div></div>
    <div class="stat"><div class="k">需要处理</div><div class="v" id="statFailed" style="font-size:15px">–</div></div>
  </div>

  <h2>本次结果</h2>
  <div id="cards" class="grid"></div>
  <div id="empty" class="empty" style="display:none">还没有运行记录，点右上角“立即签到”跑一次。</div>

  <h2>历史记录</h2>
  <table>
    <thead><tr><th>时间</th><th>结果</th><th>耗时</th><th>失败项</th></tr></thead>
    <tbody id="runs"><tr><td colspan="4" style="color:var(--muted)">暂无</td></tr></tbody>
  </table>

  <footer>checkin · 凭据只在本机 / 本容器，页面不加载任何外部资源</footer>
</div>
<div class="toast" id="toast"></div>

<script>
var DEMO = {"updated_at": "2026-10-22T11:41:16", "ok": 4, "total": 9, "elapsed": 28.8, "running": false, "schedule": {"enabled": true, "times": ["09:10", "21:30"], "source": "panel", "env_run_at": "", "next_run": "2026-10-22T21:30", "now": "2026-10-22T11:41", "timezone": "Asia/Shanghai"}, "entries": [{"site": "百度网盘", "label": "", "ok": true, "elapsed": 2.1, "error": "", "lines": [{"name": "签到", "value": "+5 成长值"}, {"name": "会员", "value": "V1，成长值 10"}]}, {"site": "哔哩哔哩", "label": "", "ok": true, "elapsed": 1.4, "error": "", "lines": [{"name": "账号", "value": "sevilx"}, {"name": "等级", "value": "Lv6"}, {"name": "硬币", "value": "1011.5"}]}, {"site": "飞牛 NAS 论坛", "label": "", "ok": false, "elapsed": 6.2, "error": "飞牛论坛返回 HTTP 503（已重试 3 次）—— 站点维护或被限流，过几小时再试", "lines": []}, {"site": "什么值得买", "label": "", "ok": true, "elapsed": 1.8, "error": "", "lines": [{"name": "签到", "value": "签到成功，+08 分"}, {"name": "经验", "value": "+2"}, {"name": "连续签到", "value": "已连续签到 5 天"}]}, {"site": "百度贴吧", "label": "", "ok": true, "elapsed": 9.3, "error": "", "lines": [{"name": "已签到", "value": "6"}, {"name": "未签到", "value": "0"}]}, {"site": "V2EX 论坛", "label": "", "ok": true, "elapsed": 2.6, "error": "", "lines": [{"name": "账号", "value": "sevilx"}, {"name": "今日签到", "value": "已领取每日登录奖励"}, {"name": "连续登录", "value": "128 天"}]}, {"site": "NodeSeek", "label": "", "ok": false, "elapsed": 1.1, "error": "被 Cloudflare 拦截（HTTP 403），请求没到 NodeSeek 服务器。三个办法：1) 浏览器打开 nodeseek.com 完成一次验证，然后把 cf_clearance 一并复制进 Cookie；2) 代理要固定出口 IP；3) 用家宽出口", "lines": []}, {"site": "天翼云盘 189", "label": "138***0000", "ok": false, "elapsed": 5.4, "error": "登录未通过：[Can not get 'sessionId']，可能需要先在官方页面完成一次图形验证码登录", "lines": []}, {"site": "LinuxDo 论坛", "label": "", "ok": false, "elapsed": 1.2, "error": "被 Cloudflare 拦截（HTTP 403）：请求没到 linux.do。换一个代理出口（机房 IP 容易被拦）", "lines": []}], "runs": [{"at": "2026-10-22T11:41:16", "ok": 4, "total": 9, "elapsed": 28.8, "failed": ["飞牛 NAS 论坛", "NodeSeek", "天翼云盘 189", "LinuxDo 论坛"]}, {"at": "2026-10-21T21:30:04", "ok": 7, "total": 9, "elapsed": 26.1, "failed": ["飞牛 NAS 论坛", "NodeSeek"]}, {"at": "2026-10-21T09:10:02", "ok": 7, "total": 9, "elapsed": 25.4, "failed": ["飞牛 NAS 论坛", "NodeSeek"]}]};
window.fetch = function () { return Promise.resolve({ status: 200, json: function () { return Promise.resolve(DEMO); } }); };
setTimeout(function () { clearTimeout(window.__t); }, 0);
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var timer = null;

  function esc(text) {
    var div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  function toast(message) {
    var el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function renderCard(entry) {
    var rows = (entry.lines || []).map(function (line) {
      return '<div class="row"><span class="rn">' + esc(line.name) + '</span><span class="rv">' + esc(line.value) + '</span></div>';
    }).join('');
    if (!entry.ok && entry.error) {
      rows += '<div class="row"><span class="rn">错误</span><span class="rv err">' + esc(entry.error) + '</span></div>';
    }
    return '<div class="card">' +
      '<div class="top"><span class="name">' + esc(entry.site) + '</span>' +
      (entry.label ? '<span class="label">' + esc(entry.label) + '</span>' : '') +
      '<span class="badge ' + (entry.ok ? 'ok' : 'bad') + '">' + (entry.ok ? '成功' : '失败') + '</span></div>' +
      '<div class="body">' + (rows || '<div class="row"><span class="rv" style="color:var(--muted)">无详情</span></div>') + '</div>' +
      '</div>';
  }

  function render(data) {
    var entries = data.entries || [];
    var total = data.total || entries.length;
    var ok = data.ok || 0;

    $('title').textContent = document.title;
    $('stamp').textContent = data.updated_at ? '上次执行 ' + data.updated_at.replace('T', ' ') : '尚未执行';
    $('statOk').textContent = total ? ok + ' / ' + total : '–';
    $('statElapsed').textContent = data.elapsed ? data.elapsed + ' 秒' : '–';
    $('statTime').textContent = data.updated_at ? data.updated_at.replace('T', ' ') : '–';

    var failed = entries.filter(function (e) { return !e.ok; });
    $('statFailed').textContent = failed.length ? failed.map(function (e) { return e.site; }).join('、') : '无';

    var cfg = data.schedule || {};
    if (!cfg.enabled) {
      $('statNext').textContent = '未启用';
      $('statNext').title = '在「设置 → 定时运行」里开启';
    } else if (cfg.next_run) {
      $('statNext').textContent = cfg.next_run.replace('T', ' ');
      $('statNext').title = '每天 ' + (cfg.times || []).join('、') + '（' + cfg.timezone + '）';
    } else {
      $('statNext').textContent = '–';
    }

    $('cards').innerHTML = entries.map(renderCard).join('');
    $('empty').style.display = entries.length ? 'none' : 'block';

    var running = !!data.running;
    $('banner').classList.toggle('show', running);
    $('run').disabled = running;

    var runs = data.runs || [];
    $('runs').innerHTML = runs.length ? runs.map(function (run) {
      return '<tr><td>' + esc((run.at || '').replace('T', ' ')) + '</td>' +
        '<td>' + (run.ok === run.total ? '<span style="color:var(--ok)">' + run.ok + ' / ' + run.total + '</span>'
          : '<span style="color:var(--bad)">' + run.ok + ' / ' + run.total + '</span>') + '</td>' +
        '<td>' + esc(run.elapsed) + ' 秒</td>' +
        '<td>' + esc((run.failed || []).join('、') || '–') + '</td></tr>';
    }).join('') : '<tr><td colspan="4" style="color:var(--muted)">暂无</td></tr>';
  }

  function load() {
    fetch('/api/status', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (resp) {
        if (resp.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
        return resp.json();
      })
      .then(function (data) {
        render(data);
        if (data.running) { schedule(5000); }
      })
      .catch(function () {});
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(load, ms);
  }

  $('refresh').addEventListener('click', function () { load(); toast('已刷新'); });

  $('run').addEventListener('click', function () {
    $('run').disabled = true;
    fetch('/api/run', { method: 'POST', credentials: 'same-origin' })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        toast(data.message || '已提交');
        $('banner').classList.add('show');
        $('bannerText').textContent = data.message || '任务执行中…';
        schedule(3000);
      })
      .catch(function () { $('run').disabled = false; toast('提交失败'); });
  });

  load();
  schedule(30000);
})();
</script>
</body>
</html>
